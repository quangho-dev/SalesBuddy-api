[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.83",
    "celery[redis]>=5.6.3",
    "clerk-backend-api>=7.0.0",
    "fastapi>=0.141.1",
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.0",
    "langchain-tavily>=0.2.18",
    "llama-index-core>=0.14.24",
    "llama-index-embeddings-openai>=0.6.0",
    "llama-index-llms-openai>=0.7.10",
    "markdown>=3.10.3",
    "nltk>=3.10.3",
    "pandas>=2.3.3",
    "pdf2image>=1.17.0",
    "pdfminer-six>=20260107",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "scrapingbee>=2.1.1",
    "supabase>=2.31.0",
    "unstructured>=0.27.5",
    "uvicorn>=0.52.4",
    "watchfiles>=1.2.0",
]

# Newer numba/llvmlite dropped Intel macOS wheels, so uv tries to compile
# llvmlite from source (needs cmake + LLVM). Pin the last versions with wheels.
[tool.uv]
constraint-dependencies = [
    "numba>=0.61.0,<0.62",
    "llvmlite>=0.44.0,<0.45",
]
