services:
  redis:
    image: redis:7-alpine
    container_name: sales-buddy-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sales-buddy-api:1.0.0
    container_name: sales-buddy-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REDIS_URL: redis://redis:6379/0
      SUPABASE_API_URL: http://host.docker.internal:54321
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./src:/app/src
    command: >
      uv run uvicorn src.server:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/src
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  worker:
    image: sales-buddy-api:1.0.0
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REDIS_URL: redis://redis:6379/0
      SUPABASE_API_URL: http://host.docker.internal:54321
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./src:/app/src
    command: >
      uv run watchfiles
      --filter python
      "celery -A src.services.celery:celery_app worker --loglevel=info --pool=threads"
      /app/src
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

networks:
  default:
    name: sales-buddy-network

volumes:
  redis_data:
